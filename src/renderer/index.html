<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: https:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Platinum Path</title>
  <link rel="stylesheet" href="./css/styles.css"/>
</head>
<body>

<aside id="sidebar">
  <div class="brand">
    <img class="logo" src="../assets/icon.png" alt=""/>
    <span>Platinum Path</span>
  </div>
  <nav class="navScroll">
    <div class="navTitle" data-i18n="nav.library"></div>
    <button class="navItem" type="button" data-mode="all"><i>🎮</i><span data-i18n="tab.all"></span></button>
    <button class="navItem" type="button" data-mode="in_progress"><i>▶</i><span data-i18n="status.in_progress"></span></button>
    <button class="navItem" type="button" data-mode="possible_100"><i>🎯</i><span data-i18n="status.possible_100"></span></button>
    <button class="navItem" type="button" data-mode="almost"><i>🔥</i><span data-i18n="tab.almost"></span></button>
    <button class="navItem" type="button" data-mode="paused"><i>⏸</i><span data-i18n="status.paused"></span></button>
    <button class="navItem" type="button" data-mode="todo"><i>⌛</i><span data-i18n="tab.todo"></span></button>
    <button class="navItem" type="button" data-mode="done"><i>💎</i><span data-i18n="tab.done"></span></button>
    <button class="navItem" type="button" data-mode="year"><i>📅</i><span data-i18n="tab.year"></span></button>

    <div class="navTitle" data-i18n="nav.collections"></div>
    <div id="collectionNav"></div>

    <div class="navTitle" data-i18n="nav.explore"></div>
    <button class="navItem" type="button" data-view="showcase"><i>🏆</i><span data-i18n="showcase.title"></span></button>
    <button class="navItem" type="button" data-view="stats"><i>📊</i><span data-i18n="stats.title"></span></button>
    <button class="navItem" type="button" data-view="recap"><i>✨</i><span data-i18n="recap.title"></span></button>
  </nav>
  <div class="sideFoot">
    <button class="navItem" type="button" id="settingsBtn"><i>⚙</i><span data-i18n="settings.title"></span></button>
    <div class="menuWrap">
      <button class="navItem" type="button" id="moreBtn" aria-haspopup="true" aria-expanded="false"><i>⋯</i><span data-i18n="more.title"></span></button>
      <div class="menu up" id="moreMenu" role="menu" hidden>
        <button type="button" role="menuitem" id="exportBtn" data-i18n="backup.export"></button>
        <button type="button" role="menuitem" id="importBtn" data-i18n="backup.import"></button>
        <button type="button" role="menuitem" id="hltbAllBtn" data-i18n="more.hltbAll"></button>
        <button type="button" role="menuitem" id="dataFolderBtn" data-i18n="more.dataFolder"></button>
        <button type="button" role="menuitem" id="wizardOpenFromMenu" data-i18n="more.wizard"></button>
      </div>
    </div>
  </div>
</aside>

<header id="appHeader">
  <div class="topbar">
    <h1 id="viewTitle"></h1>
    <select id="yearSelect" hidden></select>
    <div class="controls" id="libraryControls">
      <input id="q" type="search" data-i18n-placeholder="search.placeholder" autocomplete="off"/>
      <button class="btn" id="filterBtn" type="button"><span data-i18n="filters.button"></span> <span class="countBadge" id="filterCount" hidden></span></button>
      <div class="seg">
        <select id="sort" data-i18n-title="sort.title">
          <option value="name" data-i18n="sort.name"></option>
          <option value="priority" data-i18n="sort.priority"></option>
          <option value="pct" data-i18n="sort.pct"></option>
          <option value="remaining" data-i18n="sort.remaining"></option>
          <option value="hours" data-i18n="sort.hours"></option>
          <option value="hltb" data-i18n="sort.hltb"></option>
          <option value="diff" data-i18n="sort.diff"></option>
          <option value="rating" data-i18n="sort.rating"></option>
          <option value="played" data-i18n="sort.played"></option>
          <option value="added" data-i18n="sort.added"></option>
        </select>
        <button class="btn iconOnly" id="sortDirBtn" type="button" data-i18n-title="sort.invert">↕</button>
      </div>
      <div class="seg viewToggle" role="group">
        <button class="btn iconOnly" type="button" data-viewmode="grid" data-i18n-title="view.grid">▦</button>
        <button class="btn iconOnly" type="button" data-viewmode="list" data-i18n-title="view.list">☰</button>
      </div>
    </div>
    <div class="controls">
      <button class="btn primary" id="addGamesBtn" type="button" data-i18n="add.button"></button>
      <button class="btn" id="syncBtn" type="button"><span id="syncLabel" data-i18n="sync.button"></span></button>
    </div>
  </div>
  <div class="subbar">
    <div id="nowPlaying" class="nowPlaying" hidden></div>
    <div id="banner" class="banner" hidden></div>
    <div class="stats" id="statsBar"></div>
    <div class="syncProgress" id="syncProgress" hidden><div class="bar"><i id="syncProgressBar"></i></div><span id="syncProgressText" class="muted"></span></div>
  </div>
</header>

<main id="main">
  <section id="libraryView">
    <div class="grid" id="grid"></div>
    <div class="listWrap" id="listView" hidden></div>
    <div class="empty" id="emptyState" hidden></div>
  </section>
  <section id="showcaseView" hidden></section>
  <section id="statsView" hidden><div id="statsBody"></div></section>
  <section id="recapView" hidden></section>
</main>

<div id="toasts" class="toasts" aria-live="polite"></div>
<canvas id="confetti" hidden></canvas>
<div id="celebrate" class="celebrate" hidden></div>

<!-- Settings -->
<dialog id="settingsModal">
  <form method="dialog" id="settingsForm">
    <div class="modalHead"><b data-i18n="settings.title"></b><button class="iconbtn" value="cancel" type="submit" data-i18n-aria-label="common.close">✕</button></div>
    <div class="modalBody">
      <div class="form">
        <div class="full">
          <label for="steamApiKey"><span data-i18n="settings.apiKey"></span>
            <a class="link" href="#" data-external-url="https://steamcommunity.com/dev/apikey" data-i18n="settings.getHere"></a></label>
          <input id="steamApiKey" type="password" autocomplete="off" spellcheck="false"/>
          <div class="muted hint" id="apiKeyHint"></div>
          <label class="check" id="clearKeyWrap" hidden><input type="checkbox" id="clearApiKey"/> <span data-i18n="settings.clearKey"></span></label>
        </div>
        <div class="full">
          <label for="steamId"><span data-i18n="settings.profile"></span>
            <a class="link" href="#" data-external-url="https://steamcommunity.com/my/profile" data-i18n="settings.openProfile"></a></label>
          <input id="steamId" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="settings.profilePh"/>
          <div class="muted hint" data-i18n="settings.profileHint"></div>
        </div>
        <div>
          <label for="language" data-i18n="settings.language"></label>
          <select id="language"><option value="spanish">Español</option><option value="english">English</option></select>
        </div>
        <div>
          <label for="achLanguage" data-i18n="settings.achLanguage"></label>
          <select id="achLanguage">
            <option value="auto" data-i18n="settings.achLangAuto"></option>
            <option value="spanish">Español (España)</option>
            <option value="latam">Español (Latinoamérica)</option>
            <option value="english">English</option>
            <option value="french">Français</option>
            <option value="german">Deutsch</option>
            <option value="italian">Italiano</option>
            <option value="portuguese">Português</option>
            <option value="brazilian">Português (Brasil)</option>
          </select>
        </div>
        <div>
          <label for="syncMinutes" data-i18n="settings.syncEvery"></label>
          <input id="syncMinutes" type="number" min="15" step="5"/>
          <div class="muted hint" data-i18n="settings.syncHint"></div>
        </div>
        <div>
          <label for="yearlyGoal" data-i18n="settings.yearlyGoal"></label>
          <input id="yearlyGoal" type="number" min="0" step="1" placeholder="0"/>
          <div class="muted hint" data-i18n="settings.yearlyGoalHint"></div>
        </div>
        <div class="full">
          <label class="check"><input type="checkbox" id="notifications"/> <span data-i18n="settings.notifications"></span></label>
          <label class="check"><input type="checkbox" id="closeToTray"/> <span data-i18n="settings.closeToTray"></span></label>
          <label class="check"><input type="checkbox" id="startWithWindows"/> <span data-i18n="settings.startWithWindows"></span></label>
          <label class="check"><input type="checkbox" id="hltbEnabled"/> <span data-i18n="settings.hltbEnabled"></span></label>
          <div class="muted hint" data-i18n="settings.hltbHint"></div>
        </div>
        <div class="full">
          <label data-i18n="settings.color"></label>
          <div class="swatches" id="swatches"></div>
        </div>
        <div class="full aboutRow">
          <div>
            <div class="muted"><span>Platinum Path</span> <span id="appVersion"></span> <span id="updateText"></span></div>
            <button class="btn small" id="checkUpdateBtn" type="button" data-i18n="update.check"></button>
          </div>
          <div class="support">
            <span class="muted" data-i18n="settings.support"></span>
            <button class="btn primary small" type="button" data-external-url="https://paypal.me/muertemilfx" data-i18n="settings.donate"></button>
          </div>
        </div>
      </div>
      <div class="formError" id="settingsError" hidden></div>
    </div>
    <div class="modalFoot"><span></span><div class="row"><button class="btn" value="cancel" type="submit" data-i18n="common.cancel"></button><button class="btn primary" id="saveSettingsBtn" type="button" data-i18n="common.save"></button></div></div>
  </form>
</dialog>

<!-- Add games -->
<dialog id="addModal" class="wide">
  <form method="dialog">
    <div class="modalHead"><b data-i18n="add.title"></b><button class="iconbtn" value="cancel" type="submit" data-i18n-aria-label="common.close">✕</button></div>
    <div class="modalBody">
      <div class="addTabs">
        <button class="btn tab primary" type="button" data-addtab="owned" data-i18n="add.fromLibrary"></button>
        <button class="btn tab" type="button" data-addtab="store" data-i18n="add.fromStore"></button>
      </div>
      <section data-addpane="owned">
        <div class="row">
          <input id="ownedSearch" type="search" data-i18n-placeholder="add.filterPh" autocomplete="off" class="grow"/>
          <button class="btn" id="reloadOwnedBtn" type="button" data-i18n="add.reload"></button>
        </div>
        <div class="row optionsRow">
          <label class="check"><input type="checkbox" id="ownedOnlyStats" checked/> <span data-i18n="add.onlyWithAch"></span></label>
          <label class="check"><input type="checkbox" id="ownedHideAdded" checked/> <span data-i18n="add.hideAdded"></span></label>
          <label class="check"><input type="checkbox" id="ownedShowIgnored"/> <span data-i18n="add.showIgnored"></span></label>
          <label class="check"><input type="checkbox" id="selectAllOwned"/> <span data-i18n="add.selectAll"></span></label>
          <span class="muted" id="selectedCount"></span>
        </div>
        <div id="ownedList" class="ownedGrid"></div>
      </section>
      <section data-addpane="store" hidden>
        <div class="muted" data-i18n="add.storeHint"></div>
        <div class="row" style="margin-top:8px">
          <input id="storeTerm" type="text" data-i18n-placeholder="add.storePh" class="grow"/>
          <button class="btn" id="storeSearchBtn" type="button" data-i18n="add.search"></button>
        </div>
        <div id="storeResults" class="storeGrid"></div>
      </section>
    </div>
    <div class="modalFoot"><span class="muted" id="addFootInfo"></span><div class="row"><button class="btn" value="cancel" type="submit" data-i18n="common.close"></button><button class="btn primary" id="addCheckedBtn" type="button" data-i18n="add.addSelected"></button></div></div>
  </form>
</dialog>

<!-- Game sheet -->
<dialog id="editModal" class="xwide sheet">
  <form method="dialog" id="editForm">
    <div class="hero" id="sheetHero">
      <div class="heroBg" id="heroBg"></div>
      <button class="iconbtn heroClose" value="cancel" type="submit" data-i18n-aria-label="common.close">✕</button>
      <div class="heroContent">
        <div class="heroCover"><img id="editCover" alt=""/></div>
        <div class="heroInfo">
          <div id="editTitle" class="editTitle"></div>
          <div class="heroSub"><span class="muted" id="editSub"></span><span id="heroCollections" class="chipsInline"></span></div>
          <div class="heroStats" id="heroStats"></div>
          <div class="linkRow">
            <button class="btn small" type="button" data-game-link="play" data-i18n="link.play"></button>
            <button class="btn small" type="button" data-game-link="store" data-i18n="link.store"></button>
            <button class="btn small" type="button" data-game-link="achievements" data-i18n="link.achievements"></button>
            <button class="btn small" type="button" data-game-link="guides" data-i18n="link.guides"></button>
            <button class="btn small" type="button" id="hltbLinkBtn" hidden>HowLongToBeat ↗</button>
          </div>
        </div>
      </div>
    </div>
    <div id="editAlert" class="alert" hidden></div>
    <div class="sheetTabs" role="tablist">
      <button type="button" class="sheetTab on" data-sheettab="ach"><span data-i18n="ach.title"></span> <span class="muted" id="achCount"></span></button>
      <button type="button" class="sheetTab" data-sheettab="data" data-i18n="sheet.myData"></button>
    </div>
    <div class="modalBody sheetBody">
      <section data-sheetpane="ach">
        <div class="row achControls">
          <select id="achFilter">
            <option value="all" data-i18n="ach.f.all"></option>
            <option value="locked" data-i18n="ach.f.locked"></option>
            <option value="unlocked" data-i18n="ach.f.unlocked"></option>
            <option value="tag:missable" data-i18n="tag.missable"></option>
            <option value="tag:online" data-i18n="tag.online"></option>
            <option value="tag:coop" data-i18n="tag.coop"></option>
            <option value="tag:grind" data-i18n="tag.grind"></option>
            <option value="tag:hard" data-i18n="tag.hard"></option>
            <option value="hidden" data-i18n="ach.f.hidden"></option>
            <option value="noted" data-i18n="ach.f.noted"></option>
          </select>
          <select id="achSort">
            <option value="easy" data-i18n="ach.s.easy"></option>
            <option value="rare" data-i18n="ach.s.rare"></option>
            <option value="recent" data-i18n="ach.s.recent"></option>
            <option value="default" data-i18n="ach.s.default"></option>
          </select>
          <input id="achSearch" type="search" data-i18n-placeholder="ach.searchPh" class="grow"/>
          <button class="btn small" id="achRefreshBtn" type="button" data-i18n="ach.refresh"></button>
        </div>
        <div id="nextTarget"></div>
        <div id="achievementsList" class="achList"></div>
      </section>
      <section data-sheetpane="data" hidden>
        <div class="form">
          <div class="full"><label for="editStatus" data-i18n="edit.status"></label>
            <select id="editStatus">
              <option value="" data-i18n="status.none"></option>
              <option value="in_progress" data-i18n="status.in_progress"></option>
              <option value="possible_100" data-i18n="status.possible_100"></option>
              <option value="paused" data-i18n="status.paused"></option>
            </select></div>
          <div class="full">
            <label for="collectionInput" data-i18n="edit.collections"></label>
            <div class="chipInput" id="collectionChips"><input id="collectionInput" list="collectionSuggestions" data-i18n-placeholder="edit.collectionsPh"/></div>
            <datalist id="collectionSuggestions"></datalist>
          </div>
          <div><label for="editRating" data-i18n="edit.rating"></label><input id="editRating" type="number" min="1" max="100"/></div>
          <div><label for="editDifficulty" data-i18n="edit.difficulty"></label><input id="editDifficulty" type="number" min="1" max="10"/><div class="muted hint" id="estDiffHint"></div></div>
          <div><label for="editManualHours" data-i18n="edit.manualHours"></label><input id="editManualHours" type="number" min="0" step="0.1"/><div class="muted hint" id="steamHoursHint"></div></div>
          <div><label for="editHltbManual" data-i18n="edit.hltbManual"></label><input id="editHltbManual" type="number" min="0" step="0.5"/><div class="muted hint" id="hltbHint"></div></div>
          <div><label for="editGenrePrimary" data-i18n="edit.genre1"></label><input id="editGenrePrimary" list="genreSuggestions" type="text"/></div>
          <div><label for="editGenreSecondary" data-i18n="edit.genre2"></label><input id="editGenreSecondary" list="genreSuggestions" type="text"/></div>
          <datalist id="genreSuggestions"></datalist>
          <div class="full"><label for="editNotes" data-i18n="edit.notes"></label><textarea id="editNotes" data-i18n-placeholder="edit.notesPh"></textarea></div>
        </div>
        <div class="muted descBox" id="editDescription" hidden></div>
      </section>
    </div>
    <div class="modalFoot">
      <button class="btn danger" id="deleteGameBtn" type="button" data-i18n="edit.delete"></button>
      <div class="row"><button class="btn" value="cancel" type="submit" data-i18n="common.close"></button><button class="btn primary" id="saveGameBtn" type="button" data-i18n="common.save"></button></div>
    </div>
  </form>
</dialog>

<!-- Filters -->
<dialog id="filterModal">
  <form method="dialog">
    <div class="modalHead"><b data-i18n="filters.title"></b><button class="iconbtn" value="cancel" type="submit" data-i18n-aria-label="common.close">✕</button></div>
    <div class="modalBody">
      <div class="form">
        <div class="full">
          <label data-i18n="filters.rating"></label>
          <div class="grid2">
            <input id="filterMinScore" type="number" min="1" max="100" data-i18n-placeholder="filters.min"/>
            <input id="filterMaxScore" type="number" min="1" max="100" data-i18n-placeholder="filters.max"/>
          </div>
          <label class="check"><input id="filterOnlyRated" type="checkbox"/> <span data-i18n="filters.onlyRated"></span></label>
        </div>
        <div class="full">
          <label data-i18n="filters.difficulty"></label>
          <div class="chips">
            <label class="chip"><input type="checkbox" data-diff="1-3"/> <span data-i18n="filters.d13"></span></label>
            <label class="chip"><input type="checkbox" data-diff="4-6"/> <span data-i18n="filters.d46"></span></label>
            <label class="chip"><input type="checkbox" data-diff="7-8"/> <span data-i18n="filters.d78"></span></label>
            <label class="chip"><input type="checkbox" data-diff="9-10"/> <span data-i18n="filters.d910"></span></label>
          </div>
          <div class="muted hint" data-i18n="filters.diffHint"></div>
        </div>
        <div class="full">
          <label data-i18n="filters.hours"></label>
          <div class="grid2">
            <input id="filterMinHours" type="number" min="0" data-i18n-placeholder="filters.min"/>
            <input id="filterMaxHours" type="number" min="0" data-i18n-placeholder="filters.max"/>
          </div>
        </div>
        <div class="full">
          <label data-i18n="filters.progress"></label>
          <div class="chips">
            <label class="chip"><input type="checkbox" data-prog="0-25"/> 0–25%</label>
            <label class="chip"><input type="checkbox" data-prog="25-50"/> 25–50%</label>
            <label class="chip"><input type="checkbox" data-prog="50-75"/> 50–75%</label>
            <label class="chip"><input type="checkbox" data-prog="75-99"/> 75–99%</label>
            <label class="chip"><input type="checkbox" data-prog="100"/> 100%</label>
          </div>
        </div>
        <div>
          <label for="filterGenre" data-i18n="filters.genres"></label>
          <select id="filterGenre"></select>
        </div>
        <div>
          <label for="filterCollection" data-i18n="filters.collection"></label>
          <select id="filterCollection"></select>
        </div>
        <div class="full row">
          <label class="check"><input id="filterOnlyNotes" type="checkbox"/> <span data-i18n="filters.onlyNotes"></span></label>
          <label class="check"><input id="filterHideNoAch" type="checkbox"/> <span data-i18n="filters.hideNoAch"></span></label>
        </div>
      </div>
    </div>
    <div class="modalFoot">
      <button class="btn" id="clearFiltersBtn" type="button" data-i18n="filters.clear"></button>
      <div class="row"><button class="btn" value="cancel" type="submit" data-i18n="common.close"></button><button class="btn primary" id="applyFiltersBtn" type="button" data-i18n="filters.apply"></button></div>
    </div>
  </form>
</dialog>

<!-- First-run setup -->
<dialog id="wizardModal">
  <form method="dialog">
    <div class="modalHead"><b data-i18n="wizard.title"></b>
      <div class="row">
        <select id="wizardLanguage" aria-label="Language"><option value="spanish">Español</option><option value="english">English</option></select>
        <button class="iconbtn" value="cancel" type="submit" data-i18n-aria-label="common.close">✕</button>
      </div>
    </div>
    <div class="modalBody">
      <div class="wSteps"><span class="wDot"></span><span class="wDot"></span><span class="wDot"></span><span class="muted" id="wizardStepLabel"></span></div>

      <section data-wstep="key">
        <h3 class="wTitle" data-i18n="wizard.keyTitle"></h3>
        <p class="wText" data-i18n="wizard.keyIntro"></p>
        <ol class="wList">
          <li data-i18n="wizard.key1"></li>
          <li data-i18n="wizard.key2"></li>
          <li data-i18n="wizard.key3"></li>
        </ol>
        <button class="btn small" type="button" data-external-url="https://steamcommunity.com/dev/apikey" data-i18n="wizard.openKeyPage"></button>
        <label for="wizardKey" class="wLabel" data-i18n="settings.apiKey"></label>
        <input id="wizardKey" type="password" autocomplete="off" spellcheck="false"/>
        <div class="muted hint" id="wizardKeySaved" data-i18n="wizard.keySaved" hidden></div>
        <div class="muted hint" data-i18n="wizard.keyPrivacy"></div>
      </section>

      <section data-wstep="profile" hidden>
        <h3 class="wTitle" data-i18n="wizard.profileTitle"></h3>
        <p class="wText" data-i18n="wizard.profileIntro"></p>
        <label for="wizardProfile" class="wLabel"><span data-i18n="settings.profile"></span>
          <a class="link" href="#" data-external-url="https://steamcommunity.com/my/profile" data-i18n="settings.openProfile"></a></label>
        <input id="wizardProfile" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="settings.profilePh"/>
        <div class="muted hint" data-i18n="settings.profileHint"></div>
      </section>

      <section data-wstep="check" hidden>
        <h3 class="wTitle" data-i18n="wizard.checkTitle"></h3>
        <p class="wText" data-i18n="wizard.checkIntro"></p>
        <div id="wizardCheck"></div>
      </section>

      <div class="formError" id="wizardError" hidden></div>
    </div>
    <div class="modalFoot">
      <button class="btn" type="button" id="wizardSkip" data-i18n="wizard.skip"></button>
      <div class="row"><button class="btn" type="button" id="wizardBack" data-i18n="wizard.back"></button><button class="btn primary" type="button" id="wizardNext"></button></div>
    </div>
  </form>
</dialog>

<!-- Confirm -->
<dialog id="confirmModal" class="small">
  <form method="dialog">
    <div class="modalBody"><p id="confirmText"></p></div>
    <div class="modalFoot"><span></span><div class="row"><button class="btn" value="cancel" type="submit" id="confirmCancel"></button><button class="btn danger" value="ok" type="submit" id="confirmOk"></button></div></div>
  </form>
</dialog>
